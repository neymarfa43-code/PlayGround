function startBattle(pickA=playerPick,pickB=enemyPick,aiLevel=difficultyPick,quick=false){if(player?.root)scene.remove(player.root);removeFighters();playerPick=pickA;enemyPick=pickB;difficultyPick=aiLevel;const p=makeFighter(roster[pickA]),e=makeFighter(roster[pickB],true);fighters=[p,e];setStage(stagePick);worldMode='battle';mode='fight';roundOver=false;fightTime=99;elapsed=0;combatRound++;p.root.position.set(-2.8,0,0);e.root.position.set(2.8,0,0);p.hp=e.hp=100;p.chakra=e.chakra=58;p.sub=e.sub=100;$('#modeTag').textContent=stages[stagePick].toUpperCase();$('#pName').textContent=p.info.name;$('#eName').textContent=e.info.name;$('#pLevel').textContent=`NV. ${progress.level}`;$('#eLevel').textContent=difficulties[aiLevel].toUpperCase();$('#roundText').textContent=`ROUND ${combatRound}`;$('#hud').classList.add('active');$('#hint').textContent='WASD mover · J atacar · K kunai · L jutsu · I defender · U substituição';$('#combo').classList.remove('show');closePanel();showNotice('LUTEM!');}

$('#panel').addEventListener('click',e=>{const pick=e.target.closest('[data-pick]');if(pick){const i=+pick.dataset.pick;if(pick.dataset.side==='player')playerPick=i;else enemyPick=i;selectionMenu();return;}const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'home':mainMenu();break;case'battle':selectionMenu();break;case'roster':rosterMenu();break;case'explore':beginExplore();break;case'startfight':stagePick=+$('#stageSelect').value;difficultyPick=+$('#diffSelect').value;startBattle();break;case'return':mainMenu();break;case'retry':startBattle(playerPick,enemyPick,difficultyPick);break;case'next':startBattle(playerPick,(enemyPick+1)%roster.length,Math.min(5,difficultyPick+1));break;}});

const stageDecor=[];function setStage(idx){stageDecor.forEach(o=>scene.remove(o));stageDecor.length=0;const themes=[{bg:0x9d827d,fog:0x9d827d,floor:0x77706a},{bg:0x9babb0,fog:0x9babb0,floor:0x80848a},{bg:0x65746b,fog:0x65746b,floor:0x646a5d},{bg:0xe9a978,fog:0xe9a978,floor:0xb18a68}][idx];scene.background.setHex(themes.bg);scene.fog.color.setHex(themes.fog);mats.ground.color.setHex(themes.floor);if(idx===0){for(let side of [-1,1]){const rock=part(scene,new THREE.IcosahedronGeometry(3,1),material(0x68706e),[side*8,1.3,-17],[1.3,1.9,1]);stageDecor.push(rock);}}if(idx===2){for(let i=0;i<8;i++){const tree=part(scene,new THREE.ConeGeometry(1.7,6,7),material(i%2?0x345348:0x405e4d),[(Math.random()-.5)*25,3,-15-Math.random()*8]);stageDecor.push(tree);}}if(idx===3){for(let i=0;i<9;i++){const rock=part(scene,new THREE.IcosahedronGeometry(1.5+Math.random(),1),material(0xb5906d),[(Math.random()-.5)*25,.8,-12-Math.random()*9],[1,1.3,1]);stageDecor.push(rock);}}}
function popFx(pos,color=0xffc15d,amount=9){for(let i=0;i<amount;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.055+Math.random()*.08,6,5),new THREE.MeshBasicMaterial({color,transparent:true}));m.position.copy(pos);scene.add(m);particles.push({mesh:m,v:new THREE.Vector3((Math.random()-.5)*5,Math.random()*5,(Math.random()-.5)*5),life:.42+Math.random()*.4});}}
let pendingHits=[];

function doAction(f,target){if(!f||!f.alive||roundOver)return;if(keys.j&&f.attackCd<=0)attack(f);if(pressed.k){if(f.projectileCd<=0){fireProjectile(f,'kunai',target);f.projectileCd=.7;}}if(pressed.l)castSkill(f,target);if(pressed.o)ultimate(f,target);if(pressed.u&&f.sub>=28){f.sub-=28;f.dodge=.58;f.root.visible=false;setTimeout(()=>{if(f.root)f.root.visible=true},180);popFx(f.root.position.clone().add(new THREE.Vector3(0,1,0)),0xc9a3ff,12);showNotice('SUBSTITUIÇÃO!');}if(pressed.r&&f.chakra>=35&&f.awake<=0){f.chakra-=35;f.awake=10;f.baseSpeed=7.1;showNotice('DESPERTAR — CHAKRA LIBERADO!');}}
function enemyAI(f,target,dt){if(!target?.alive||f.stun>0)return;const lv=difficultyPick,diff=Math.max(.15,[.42,.58,.78,1,1.18,1.35][lv]),d=f.root.position.distanceTo(target.root.position);f.aiTimer-=dt;f.guard=false;if(f.aiTimer>0)return;f.aiTimer=(.25+Math.random()*.5)/diff;

function endBattle(won){if(roundOver)return;roundOver=true;const earned=won?180+30*difficultyPick:50;progress.xp+=earned;if(won){progress.wins++;progress.streak++;}else progress.streak=0;progress.level=Math.floor(progress.xp/600)+1;localStorage.setItem('shinobi-save',JSON.stringify(progress));setTimeout(()=>{const label=won?'VITÓRIA':'DERROTA';$('#hud').classList.remove('active');$('#hint').textContent='';showPanel(`<div class="eyebrow">ROUND ${combatRound} · ${stages[stagePick]}</div><div class="result-mark">${label}</div><h2 class="title" style="text-align:center">${won?'HONRA AO SHINOBI':'TENTE NOVAMENTE'}</h2><p class="desc" style="text-align:center">${won?'Adversário derrotado.':'A batalha ainda não acabou.'} Você recebeu <b style="color:var(--gold)">${earned} XP</b>. Nível ${progress.level} · ${progress.wins} vitórias.</p><div class="menu-actions"><button class="main-btn" data-action="retry">REVANCHE <strong>↻</strong></button><button class="main-btn" data-action="next">PRÓXIMO DESAFIO <strong>→</strong></button><button class="main-btn" data-action="home">VOLTAR AO MENU <strong>⌂</strong></button></div>`);mode='result';},1000);}

function movePlayer(f,dt){if(f.stun>0)return;const x=(keys.d?1:0)-(keys.a?1:0),z=(keys.s?1:0)-(keys.w?1:0);let v=new THREE.Vector3(x,0,z);if(v.lengthSq()){v.normalize();f.root.position.addScaledVector(v,f.baseSpeed*(keys.shift?1.58:1)*dt);f.walk+=dt*8;}if(pressed[' ']&&f.jump<=0){f.jumpV=7;f.jump=.01;}if(f.jump>0){f.jumpV-=19*dt;f.root.position.y+=f.jumpV*dt;if(f.root.position.y<=0){f.root.position.y=0;f.jump=0;f.jumpV=0;}else f.jump=f.root.position.y;}f.root.position.x=THREE.MathUtils.clamp(f.root.position.x,-12,12);f.root.position.z=THREE.MathUtils.clamp(f.root.position.z,-12,12);}
function animateFighter(f,dt,target){if(!f)return;f.attackCd=Math.max(0,f.attackCd-dt);f.skillCd=Math.max(0,f.skillCd-dt);f.projectileCd=Math.max(0,f.projectileCd-dt);f.stun=Math.max(0,f.stun-dt);f.dodge=Math.max(0,f.dodge-dt);f.awake=Math.max(0,f.awake-dt);if(f.awake<=0)f.baseSpeed=5.2;f.comboTimer-=dt;if(f.comboTimer<=0){f.combo=0;if(!f.enemy)$('#combo').classList.remove('show');}if(f.attackAnim>0){f.attackAnim-=dt;if(!f.hitDone&&f.attackAnim<=.21){f.hitDone=true;if(target&&f.root.position.distanceTo(target.root.position)<2.7){const aim=new THREE.Vector3(Math.sin(f.root.rotation.y),0,Math.cos(f.root.rotation.y)),delta=new THREE.Vector3().subVectors(target.root.position,f.root.position).setY(0).normalize();if(aim.dot(delta)>.15)applyHit(f,target,8,'strike');}}}if(target&&f.root.position.distanceTo(target.root.position)>.01){const desired=Math.atan2(target.root.position.x-f.root.position.x,target.root.position.z-f.root.position.z);let diff=THREE.MathUtils.euclideanModulo(desired-f.root.rotation.y+Math.PI,Math.PI*2)-Math.PI;f.root.rotation.y+=diff*Math.min(1,dt*9);}const swing=f.attackAnim>0?Math.sin((.38-f.attackAnim)/.38*Math.PI):0;f.limbs.ra.rotation.x=-swing*1.7;f.limbs.la.rotation.x=swing*.8;f.limbs.ll.rotation.x=Math.sin(f.walk)*.55;f.limbs.rl.rotation.x=-Math.sin(f.walk)*.55;f.limbs.ra.rotation.z=f.guard?-.6:0;f.limbs.la.rotation.z=f.guard?.6:0;f.torso.rotation.z=f.stun>0?Math.sin(elapsed*35)*.12:0;f.rig.position.y=f.jump>0?f.jump*.55:Math.abs(Math.sin(f.walk*2))*.027;f.root.visible=f.dodge<=0;}
let last=performance.now();function tick(now){requestAnimationFrame(tick);const dt=Math.min(.035,(now-last)/1000);last=now;elapsed+=dt;$('#touch').style.display=(mode==='fight'||mode==='explore')&&(matchMedia('(pointer:coarse)').matches||innerWidth<=700)?'flex':'none';if(noticeTimer>0){noticeTimer-=dt;if(noticeTimer<=0)$('#notice').classList.remove('show');}
 if(mode==='fight'&&!roundOver){const [p,e]=fighters;fightTime=Math.max(0,fightTime-dt);$('#timer').textContent=Math.ceil(fightTime);if(fightTime<=0)endBattle(p.hp>=e.hp);p.guard=keys.i;movePlayer(p,dt);doAction(p,e);enemyAI(e,p,dt);animateFighter(p,dt,e);animateFighter(e,dt,p);$('#pHealth').style.width=`${p.hp}%`;$('#eHealth').style.width=`${e.hp}%`;$('#pChakra').style.width=`${p.chakra}%`;$('#eChakra').style.width=`${e.chakra}%`;$('#pSub').style.width=`${p.sub}%`;$('#pName').textContent=p.info.name;$('#eName').textContent=e.info.name;for(const f of fighters){f.chakra=Math.min(100,f.chakra+dt*(keys.l?.7:2.1));f.sub=Math.min(100,f.sub+dt*1.1);}}
 else if(mode==='explore'){movePlayer(player,dt);animateFighter(player,dt,null);let nearest=null,dist=100;for(const n of npcList){const d=player.root.position.distanceTo(n.root.position);if(d<dist){dist=d;nearest=n;}n.root.rotation.y=Math.atan2(player.root.position.x-n.root.position.x,player.root.position.z-n.root.position.z);n.rig.position.y=Math.sin(elapsed*2+n.level)*.035;}if(nearest&&dist<3.6){$('#hint').textContent=`E · CONVERSAR / DESAFIAR ${nearest.name.toUpperCase()} (NV. ${nearest.level})`;if(pressed.e){const id=roster.indexOf(nearest.info);difficultyPick=Math.min(5,Math.floor(nearest.level/2));showNotice(`${nearest.name}: “Mostre sua força!”`);setTimeout(()=>startBattle(playerPick,id,difficultyPick,true),650);}}else $('#hint').textContent='WASD mover · E conversar / desafiar · Shift correr';}
 for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];p.life-=dt;p.mesh.position.addScaledVector(p.dir,p.speed*dt);p.mesh.rotation.x+=dt*7;if(p.life<=0){scene.remove(p.mesh);projectiles.splice(i,1);continue;}if(mode==='fight'){const target=p.owner===fighters[0]?fighters[1]:fighters[0];if(target&&target.alive&&p.mesh.position.distanceTo(target.root.position.clone().add(new THREE.Vector3(0,1.3,0)))<.8){applyHit(p.owner,target,p.damage,p.kind==='skill'?'skill':'strike');scene.remove(p.mesh);projectiles.splice(i,1);}}}
 for(let i=pendingHits.length-1;i>=0;i--){pendingHits[i].time-=dt;if(pendingHits[i].time<=0){const h=pendingHits.splice(i,1)[0];applyHit(h.attacker,h.target,h.damage,h.kind);}}
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.mesh.position.addScaledVector(p.v,dt);p.v.y-=8*dt;p.mesh.scale.multiplyScalar(.96);if(p.life<=0){scene.remove(p.mesh);particles.splice(i,1);}}
 const portrait=innerWidth<700&&innerHeight>innerWidth;let target=new THREE.Vector3(0,1.15,0),camPos=new THREE.Vector3(0,8,17);if(mode==='fight'&&fighters.length===2){const [a,b]=fighters;target.copy(a.root.position).add(b.root.position).multiplyScalar(.5);target.y=1.3;camPos.set(target.x+(portrait?0:1),target.y+(portrait?7.4:6.6),Math.max(portrait?15:11,a.root.position.distanceTo(b.root.position)*(portrait?2.1:1.75)));}else if(mode==='explore'&&player){target.copy(player.root.position);target.y=1.2;camPos.set(target.x+10,target.y+8,target.z+13);}else{target.set(0,1,0);camPos.set(0,8,18);}camera.position.lerp(camPos,1-Math.exp(-dt*3));if(cameraShake>0){camera.position.x+=(Math.random()-.5)*cameraShake;camera.position.y+=(Math.random()-.5)*cameraShake;cameraShake=Math.max(0,cameraShake-dt*1.8);}camera.lookAt(target);renderer.render(scene,camera);pressed={};}
const touchKeys=new Map();
function setKey(key,down){if(down&&!keys[key])pressed[key]=true;keys[key]=down;}
window.addEventListener('keydown',e=>{const key=e.key===' '?' ':e.key.toLowerCase();if(['w','a','s','d','j','k','l','i','o','u','r','e','shift',' '].includes(key)){e.preventDefault();setKey(key,true);}});

$('#touch').addEventListener('pointerdown',e=>{const button=e.target.closest('[data-key]');if(!button)return;e.preventDefault();const key=button.dataset.key;touchKeys.set(e.pointerId,{key,button});button.classList.add('down');setKey(key,true);button.setPointerCapture(e.pointerId);});
